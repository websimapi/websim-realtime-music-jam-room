<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sonic Explorer</title>
  <link rel="stylesheet" href="styles.css">
  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.157.0/build/three.module.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.157.0/examples/jsm/"
    }
  }
  </script>
</head>
<body>
  <div id="ui-container">
    <header>
      <h1>Sonic Explorer</h1>
      <div id="room-info">Getting ready...</div>
    </header>
    
    <div class="participants" id="participants">
      <!-- Participants will be added here -->
    </div>
    
    <div id="controls" class="controls">
      <div class="control-group">
        <button id="play-btn" class="btn btn-primary">Start Playing</button>
        <button id="instrument-btn" class="btn btn-secondary">My Instruments</button>
      </div>
      
      <div class="control-group">
        <label for="volume">Volume</label>
        <input type="range" id="volume" min="0" max="100" value="70">
      </div>
    </div>
    
    <div id="mobile-controls" class="mobile-controls">
      <div class="joystick-container">
        <div id="joystick" class="joystick"></div>
      </div>
      <div class="action-buttons">
        <button id="mobile-action" class="action-button">Interact</button>
      </div>
    </div>
    
    <div id="instrument-panel" class="instrument-panel hidden">
      <div class="panel-header">
        <h2>My Instruments</h2>
        <button id="close-panel" class="btn-close">×</button>
      </div>
      <div id="instrument-list" class="instrument-list">
        <!-- Instruments will be listed here -->
      </div>
      <div class="jam-grid">
        <div class="grid-container" id="grid">
          <!-- Grid cells will be generated here -->
        </div>
        <div class="playhead" id="playhead"></div>
      </div>
      <div class="instrument-controls">
        <div class="control-group">
          <label for="tempo">Tempo</label>
          <input type="range" id="tempo" min="60" max="180" value="120">
          <div id="tempo-value">120 BPM</div>
        </div>
        <button class="btn btn-danger" id="clear-btn">Clear My Notes</button>
      </div>
    </div>
  </div>
  
  <div id="loading-screen">
    <div class="loading-content">
      <h2>Entering the Sonic World</h2>
      <div class="loading-bar"><div id="loading-progress"></div></div>
      <p id="loading-text">Loading assets...</p>
    </div>
  </div>
  
  <canvas id="world-canvas"></canvas>
  
  <script type="module" src="app.js"></script>

</body>
</html>
